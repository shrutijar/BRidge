<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRidge</title>
<meta name="description" content="BRidge is a practice app for PARS behavioral interviews, case interviews and business vocabulary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B3121A; --red-d:#8E0E14; --red-t:#FBEAEA; --red-line:#F0D4D4;
  --ink:#1E1A1D; --ink2:#342A32; --mute:#6B6168; --line:#E6E2E7; --line2:#D4CDD3;
  --bg:#F6F5F7; --card:#FFFFFF;
  --blue:#4A80F5; --purple:#B08FF5; --orange:#F4B96A;
  --green-bg:#E3F2E7; --green:#1D5A31; --amber-bg:#FBEBD3; --amber:#7A4A0B; --violet-bg:#F1ECF7; --violet:#4B3A74; --hard-bg:#F8DCDC;
  --head:'Chakra Petch',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #CF8B36;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:#fff;padding:10px 14px;border-radius:8px;z-index:100;font-weight:700}
.skip:focus{top:8px}

/* shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:flex-end;gap:5px;font-family:var(--head);font-weight:700;font-size:36px;letter-spacing:-.02em;color:var(--red);padding:0 12px 20px;line-height:1}
.logo i{width:12px;height:12px;border-radius:50%;background:#111;margin-bottom:6px}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:8px;font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--red-t)}
.nav svg{transition:transform .2s}
.nav.on svg{transform:rotate(180deg)}
.sub{display:flex;flex-direction:column;gap:2px;margin:0 0 8px 20px;padding-left:8px;border-left:2px solid var(--red-line)}
.sub a{padding:8px 10px;border-radius:6px;font-size:14px;color:#5E555C}
.sub a:hover{background:var(--bg)}
.sub a.on{color:var(--red);font-weight:700;background:var(--red-t)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 12px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.name-in{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;margin-left:-6px;font-weight:700;font-size:14px}
.name-in:hover,.name-in:focus{border-color:var(--line2);background:#fff}
.small{font-size:13px}
.mute{color:var(--mute)}
.main{padding:32px 40px 48px;display:flex;flex-direction:column;gap:24px;min-width:0;outline:none}
.foot{font-size:12px;color:var(--mute);padding-top:8px}

/* type */
h1{margin:0;font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:.01em;text-transform:uppercase;color:var(--red);text-wrap:balance}
h2{margin:0;font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
h3{margin:0;font-size:16px}
.lede{margin:6px 0 0;color:var(--mute);max-width:62ch}
.pagehead{display:flex;flex-direction:column}

/* parts */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.row>*{min-width:0}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:700;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.light{background:#fff;color:var(--red);border-color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--red-t);border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:12px}
label,.lab{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;background:#fff}
textarea{min-height:110px;resize:vertical}
select{min-height:44px}
input[type=text],input[type=number],input[type=search],input[type=date]{min-height:44px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--violet-bg);color:var(--violet);white-space:nowrap}
.pill.easy,.pill.ready{background:var(--green-bg);color:var(--green)}
.pill.medium,.pill.practice{background:var(--amber-bg);color:var(--amber)}
.pill.hard{background:var(--hard-bg);color:var(--red-d)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--red)}
.chip.on,.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.bar{height:8px;border-radius:8px;background:#EEEAEF;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--red);border-radius:8px;transition:width .5s ease}
.bar.blue>span{background:var(--blue)}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter b{width:8px;height:8px;border-radius:50%;background:#E0D9E1}
.meter b.f{background:currentColor}
.back{font-weight:700;color:var(--red);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.empty{padding:32px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
tbody tr:hover{background:#FCFBFC}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar>div{min-width:0}

/* hero */
.hero{background:linear-gradient(115deg,#8E0E14,#B3121A 60%,#C4252C);color:#fff;border-radius:18px;padding:32px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.hero h1{color:#fff;text-transform:none;font-size:40px}
.hero p{margin:10px 0 0;max-width:52ch;color:#FDE9E9;font-size:16px}
.hero .streak{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:20px;font-weight:700;font-size:13px;margin-bottom:12px}
.hero .btns{margin-top:20px}
.arch{width:240px;max-width:100%;flex:none;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--head);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--mute)}
.go{display:flex;flex-direction:column;gap:8px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff;flex:1 1 220px;min-width:0}
.go:hover{border-color:var(--red)}
.go b{font-family:var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-size:14px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#5E555C}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;border:0;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.ax{fill:#5E555C;font-size:12px;font-family:var(--body)}
.tot{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--body)}
.seg-bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.win{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.win:last-child{border:0}
.win svg{flex:none;color:var(--green);margin-top:2px}

/* case */
.stepper{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mute)}
.step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#EEEAEF;font-family:var(--head)}
.step.on{color:var(--red)}
.step.on b{background:var(--red);color:#fff}
.step.done b{background:var(--green-bg);color:var(--green)}
.box{padding:14px 16px;border-radius:10px;background:var(--bg);font-size:14px}
.box.hint{background:#FFF8E8;border:1px solid #EBD9A8}
.box.good{background:var(--green-bg);color:var(--green)}
.box.warn{background:var(--amber-bg);color:var(--amber)}
.timer{font-family:var(--head);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

/* pars + lists */
.listbtn{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.listbtn:hover{border-color:var(--red)}
.listbtn.on{border-color:var(--red);background:#FBF4F4}
.letter{width:32px;height:32px;border-radius:8px;background:var(--red-t);color:var(--red);display:grid;place-items:center;font-family:var(--head);font-weight:700;flex:none}
.field{display:flex;gap:12px;align-items:flex-start}
.field>div{flex:1;min-width:0}
.okmark{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);font-weight:700}
.okmark.y{color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.item{border:1px solid var(--line);border-radius:12px;background:#fff;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pf{display:flex;gap:14px;align-items:center}
.pf .av{width:48px;height:48px;font-size:17px;background:var(--violet)}
.coach{background:#FFFDF7;border:1px solid #E1D7C4;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}

/* flashcards */
.fstage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:8px 0}
.cardwrap{width:100%;max-width:520px;perspective:1200px;animation:cin .35s ease both}
.cardwrap.out-left{animation:outl .26s ease forwards}
.cardwrap.out-right{animation:outr .26s ease forwards}
@keyframes cin{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outl{to{opacity:0;transform:translateX(-70px) rotate(-5deg)}}
@keyframes outr{to{opacity:0;transform:translateX(70px) rotate(5deg)}}
.flipbtn{display:block;width:100%;border:0;background:none;padding:0;cursor:pointer;border-radius:18px}
.flipper{position:relative;width:100%;height:290px;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flipper.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center}
.face.front{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(60,20,30,.08)}
.face.back{background:var(--red);color:#fff;transform:rotateY(180deg);box-shadow:0 8px 24px rgba(142,14,20,.25)}
.face .term{font-family:var(--head);font-weight:700;font-size:44px;color:var(--red);line-height:1.1;text-wrap:balance}
.face .def{font-size:19px;line-height:1.45;max-width:36ch}
.face .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.face.front .tag{color:var(--mute)}
.face.back .tag{color:#FBD5D5}
.face .tap{font-size:13px;color:var(--mute)}
.face .meter{color:var(--red)}
.rate{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.fprog{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.done{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;animation:cin .4s ease both}
.done .big{font-family:var(--head);font-size:34px;font-weight:700;color:var(--red)}

/* nav on phones */
.tabbar{display:none}
.chipsm{display:none}
.sheet{position:fixed;inset:0;background:rgba(30,26,29,.45);z-index:40;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet>div{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
.sheet a{min-height:48px;display:flex;align-items:center;padding:0 12px;border-radius:8px;font-family:var(--head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.sheet a:hover{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1E1A1D;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .main{padding:20px 16px 110px}
  h1{font-size:30px}
  .hero{padding:24px}
  .hero h1{font-size:30px}
  .arch{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
  .tabbar a,.tabbar button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:#5E555C;background:none;border:0;cursor:pointer}
  .tabbar .on{color:var(--red)}
  .chipsm{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:-8px -16px 0;padding-left:16px;padding-right:16px}
  .chipsm a{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:14px}
  .chipsm a.on{background:var(--red);border-color:var(--red);color:#fff}
  .flipper{height:260px}
  .face .term{font-size:36px}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<div class="app">

  <main class="main" id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="sheet" id="sheet" hidden><div id="sheetbox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var CASES = {"coffee":{"title":"The Campus Coffee Problem","context":"A fictional regional coffee chain operates 10 campus-area stores. The CEO says annual profit fell despite unchanged customer volume.","stages":[{"title":"Clarify the objective","q":"What would you ask the CEO before beginning your analysis?","data":"The client wants to understand why profit declined and restore last year’s annual profit.","hint":"Ask about revenue, variable costs, fixed costs, pricing, and time periods.","terms":["revenue","cost","profit"],"sample":"I would confirm the profitability target, time horizon, and store coverage; then separate the change into revenue and cost drivers."},{"title":"Build your issue tree","q":"How would you structure your profitability investigation?","data":"Assume each store sells the same mix of products. Customer volume is unchanged year over year.","hint":"Profit = revenue minus costs. Break each side into drivers.","terms":["price","volume","cost"],"sample":"Profit = price × units − variable cost per unit × units − fixed costs. I would compare prices and product mix, ingredient and labor costs, and rent and overhead by store."},{"title":"Calculate the profit decline","q":"What is the annual profit decline across all 10 stores?","data":"Each store sells 200,000 drinks annually. Average selling price = $5.00, unchanged. Variable cost rose from $2.00 to $2.30 per drink. Fixed costs unchanged.","hint":"Multiply the $0.30 unit cost increase by drinks per store and then by the number of stores.","terms":["cost","volume","profit"],"answer":600000,"tolerance":0.01,"unit":"USD per year (positive profit decrease)","sample":"0.30 × 200,000 × 10 = $600,000 annual profit decline."},{"title":"CEO recommendation","q":"Give a 45-second recommendation with the number, at least two actions, a risk, and a next step.","data":"The entire $600,000 decline is due to increased variable cost. The chain wants to preserve customer experience.","hint":"Lead with the answer, then evidence, actions, risk, and validation.","terms":["600","supplier","price","risk"],"sample":"Profit fell $600,000 due to $0.30 higher variable cost per drink. I recommend negotiating supply contracts and reducing waste before testing selective pricing. The risk is harming customer loyalty; pilot changes in two stores and monitor margins and satisfaction."}]},"bikes":{"title":"Electric Bicycle Market Entry","context":"A fictional mobility startup is considering a monthly e-bike subscription for students in one university town.","stages":[{"title":"Clarify entry goal","q":"Which questions would you ask before recommending an entry?","data":"The founder wants positive annual operating profit by year two.","hint":"Clarify market demand, price, utilization, costs, and competitive alternatives.","terms":["demand","price","cost"],"sample":"I would clarify the student customer segment, willingness to pay, subscriptions per year, bike costs, maintenance, churn and competition."},{"title":"Create a market entry framework","q":"Lay out a logical, non-overlapping structure to assess the opportunity.","data":"The market is one university town and the product is an all-inclusive monthly subscription.","hint":"Think market attractiveness, competitive differentiation, economics, and execution risks.","terms":["market","competition","cost"],"sample":"I would assess market demand and student preferences, competing transportation, per-customer economics and capital needs, and operating and regulatory risks."},{"title":"Break-even subscribers","q":"How many active subscribers are required to break even on annual operating profit?","data":"Monthly fee $90. Monthly variable cost per subscriber $30. Annual fixed operating costs $360,000. Ignore capital expenditures and taxes.","hint":"Contribution per year per subscriber = 12 × (monthly fee − monthly variable cost). Divide fixed costs by that contribution.","terms":["margin","subscriber","fixed"],"answer":500,"tolerance":0.01,"unit":"Active subscribers (whole number)","sample":"Annual subscriber contribution = ($90 − $30) × 12 = $720; break-even subscribers = $360,000 / $720 = 500."},{"title":"Go / no-go","q":"Recommend whether to enter if reliable demand estimates suggest 650 subscribers. Include a profit estimate, risks, and a test.","data":"At 650 subscribers, fee is $90/month, variable cost $30/month and annual fixed operating costs $360,000.","hint":"Compute 650 × $720 − $360,000. Then assess reliability and risks.","terms":["profit","demand","risk"],"sample":"Proceed with a limited pilot: forecast annual operating profit is 650 × $720 − $360,000 = $108,000, if demand holds. Risks include churn, theft and maintenance. Validate willingness to pay with paid preorders."}]},"stream":{"title":"Student Streaming Growth","context":"A fictional education-focused streaming platform wants to grow paid subscribers without sacrificing contribution margin.","stages":[{"title":"Define growth","q":"What clarifying questions should you ask?","data":"Management wants to double annual contribution profit, not simply registered users.","hint":"Distinguish users, conversion, retention, revenue and variable costs.","terms":["subscriber","revenue","cost"],"sample":"I would ask about baseline paid subscribers, price, churn, acquisition cost, platform cost, and customer segments."},{"title":"Growth tree","q":"Structure the potential profit-growth levers.","data":"Management has not approved a price change.","hint":"Think acquisition, paid conversion, retention and contribution per user.","terms":["acquisition","conversion","retention"],"sample":"I would evaluate traffic and acquisition channels, trial-to-paid conversion, paid retention and churn, and variable delivery and acquisition costs."},{"title":"Profit impact","q":"How much does annual contribution profit increase if the paid subscriber base rises from 8,000 to 10,000?","data":"Revenue is $12 per subscriber per month and variable delivery cost is $4 per subscriber per month. Ignore acquisition cost and fixed costs.","hint":"Multiply net monthly contribution by 12 months and incremental subscribers.","terms":["subscriber","margin","revenue"],"answer":192000,"tolerance":0.01,"unit":"USD annual contribution profit increase","sample":"(10,000 − 8,000) × ($12 − $4) × 12 = $192,000."},{"title":"Growth plan","q":"Recommend a sustainable growth strategy and say what you would measure.","data":"Students report high product satisfaction but low awareness. Paid retention has been steady.","hint":"Prioritize growth channels and guardrails, not vanity metrics.","terms":["awareness","conversion","retention"],"sample":"I would test campus partnerships and referral programs to address awareness, measure incremental paid conversions and acquisition cost, and monitor retention and contribution margin."}]},"hotel":{"title":"Boutique Hotel Pricing","context":"A fictional 100-room boutique hotel is evaluating whether to raise its average nightly rate.","stages":[{"title":"Clarify the decision","q":"What information would you seek before changing prices?","data":"The hotel currently runs at 80% occupancy. Demand may fall at higher prices.","hint":"Think price sensitivity, seasonality, costs and competitor positioning.","terms":["occupancy","price","cost"],"sample":"I would clarify the target profit, variable room cost, customer segments, seasonal demand, and estimated occupancy loss after a price increase."},{"title":"Price impact framework","q":"How would you compare the current and proposed pricing strategies?","data":"Assume the same number of available rooms in each scenario.","hint":"Compute occupied rooms × price for revenue and occupied rooms × variable cost for contribution.","terms":["revenue","occupancy","cost"],"sample":"I would compare room-night revenue, variable room servicing cost, contribution, competitive risk, and demand response at the new price."},{"title":"Daily contribution uplift","q":"What is the change in DAILY contribution if price rises from $150 to $170 and occupancy falls from 80% to 75%?","data":"100 available rooms daily. Variable cost is $40 per occupied room-night. Ignore fixed costs.","hint":"Current contribution is occupied rooms × ($150 − $40). Compare with proposed occupied rooms × ($170 − $40).","terms":["contribution","occupancy","price"],"answer":950,"tolerance":0.01,"unit":"USD daily contribution increase","sample":"Current = 80 × $110 = $8,800. Proposed = 75 × $130 = $9,750. Daily uplift = $950."},{"title":"Recommendation to GM","q":"Recommend whether to raise prices, note risks and propose a pilot.","data":"The price rise increases daily contribution by $950 under assumed occupancy. The hotel worries about weekday demand.","hint":"Lead with quantified economics, then limitations and how to test.","terms":["950","occupancy","risk"],"sample":"Pilot the $170 rate because projected contribution rises $950 daily. Demand estimates might be wrong, particularly on weekdays. A controlled test by date and segment can track occupancy, contribution and guest satisfaction."}]}};

/* ---------- PARS ---------- */
function filled(s){return ['p','a','r','s'].filter(function(k){return (s[k]||'').trim().length>=40}).length}
function pageStory(){
  if(ctx.sub==='guide'){
    var g=[['P','Problem','Set the scene fast. What was happening, what was your role and what was at stake?','As events lead, our showcase was three weeks away and three teams were stuck waiting on each other.'],['A','Action','Say what you personally decided and did. Use “I”, not “we”.','I mapped the dependencies, set a daily check-in and gave each team one owner.'],['R','Result','Give the outcome with evidence. A number is best.','Ticketing opened four days early and we sold 180 of 200 seats.'],['S','So what','Say what you learned and why it matters for the role you want.','Clear owners beat extra meetings, and I start every project by naming them.']];
    return head('How PARS works','Four parts, about two minutes out loud.')+'<div class="grid2">'+g.map(function(x){return '<section class="item"><div style="display:flex;gap:12px;align-items:center"><span class="letter">'+x[0]+'</span><h3>'+x[1]+'</h3></div><p style="margin:0">'+x[2]+'</p><p class="small mute" style="margin:0">Example: '+x[3]+'</p></section>'}).join('')+'</div><div class="btns"><a class="btn pri" href="#/pars/bank">Open my story bank</a></div>';
  }
  if(!ui.sid||!S.stories.some(function(s){return s.id===ui.sid})) ui.sid=S.stories[0]?S.stories[0].id:'';
  var sf=['All','Drafting','Needs practice','Ready'];
  var list=S.stories.filter(function(s){return ui.sf==='All'||s.status===ui.sf});
  var cur=S.stories.filter(function(s){return s.id===ui.sid})[0];
  var left='<section style="flex:1 1 300px;display:flex;flex-direction:column;gap:12px;min-width:0" aria-label="Saved stories"><h2>Saved stories ('+S.stories.length+')</h2>'+
   '<div class="chips" role="group" aria-label="Filter stories">'+sf.map(function(f){return '<button type="button" class="chip" data-act="sf" data-v="'+f+'" aria-pressed="'+(ui.sf===f)+'">'+f+'</button>'}).join('')+'</div>'+
   (list.length?list.map(function(s){return '<button type="button" class="listbtn'+(s.id===ui.sid?' on':'')+'" data-act="story" data-id="'+s.id+'"><b>'+esc(s.title||'Untitled story')+'</b><div class="pills">'+pill(s.skill)+'<span data-st="'+s.id+'">'+statusPill(s.status)+'</span></div><span class="small mute">'+s.rehearsals+' rehearsal'+(s.rehearsals===1?'':'s')+(s.date?' · next practice '+fdate(s.date):'')+'</span></button>'}).join(''):'<div class="empty">No stories with this status.</div>')+
   '<div class="btns"><button type="button" class="btn pri" data-act="newstory">+ New story</button><button type="button" class="btn" data-act="export">Export for Excel</button></div></section>';
  var right=cur?editor(cur):'<div class="empty" style="flex:3 1 480px">Create your first story to begin.</div>';
  return head('PARS story bank','Build reusable stories, track your evidence and log each rehearsal.')+'<div class="row">'+left+right+'</div>';
}
function statusPill(s){return pill(s,s==='Ready'?'ready':s==='Needs practice'?'practice':'')}
function okm(s,k){var y=(s[k]||'').trim().length>=40;return '<span class="okmark'+(y?' y':'')+'" data-ok="'+k+'">'+(y?ic('check',14,3)+' Complete':'Needs a bit more')+'</span>'}

  var f=filled(s);
  var fld=function(k,l,hint){return '<div class="field"><span class="letter">'+k.toUpperCase().replace('S','S')+'</span><div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><label for="f_'+k+'" style="margin:0">'+l+'</label>'+okm(s,k)+'</div><textarea id="f_'+k+'" data-in="sf" data-f="'+k+'" placeholder="'+hint+'">'+esc(s[k])+'</textarea></div></div>'};

   '<div class="row" style="gap:12px"><div style="flex:2 1 240px"><label for="f_title">Title</label><input id="f_title" type="text" data-in="sf" data-f="title" value="'+esc(s.title)+'"></div><div style="flex:1 1 180px"><label for="f_skill">Competency</label><select id="f_skill" data-in="sf" data-f="skill">'+SKILLS.map(function(k){return '<option'+(k===s.skill?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div></div>'+
   '<div><div style="display:flex;justify-content:space-between" class="small"><b id="fcount">'+f+' of 4 sections complete</b><span class="mute">40+ characters each</span></div><div class="bar" style="margin-top:6px"><span id="fbar" style="width:'+(f*25)+'%"></span></div></div>'+
   fld('p','Problem: the situation, your role and the stakes','What was happening?')+fld('a','Action: what you personally decided and did','What did you do?')+fld('r','Result: the outcome with evidence','What changed? Use a number.')+fld('s','So what: what you learned and why it matters','What does this say about you for the role?')+
   '<div class="row" style="gap:12px"><div style="flex:1 1 220px"><label for="f_evidence">Evidence or metric source</label><input id="f_evidence" type="text" data-in="sf" data-f="evidence" value="'+esc(s.evidence)+'" placeholder="Where can you verify it?"></div><div style="flex:1 1 220px"><label for="f_next">Next improvement</label><input id="f_next" type="text" data-in="sf" data-f="next" value="'+esc(s.next)+'"></div></div>'+
   '<div class="row" style="gap:12px"><div style="flex:1 1 180px"><label for="f_status">Preparation status</label><select id="f_status" data-in="sf" data-f="status">'+['Drafting','Needs practice','Ready'].map(function(k){return '<option'+(k===s.status?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div><div style="flex:1 1 180px"><label for="f_date">Next practice date</label><input id="f_date" type="date" data-in="sf" data-f="date" value="'+esc(s.date)+'"></div></div>'+

}

function buildDeck(){
  var t=TERMS.filter(function(x){return ui.vtopic==='All'||x.topic===ui.vtopic}).sort(function(a,b){return lvl(a.id)-lvl(b.id)||a.id-b.id});

}
function term(id){return TERMS.filter(function(t){return t.id===id})[0]}
function cardHTML(){

    return '<div class="done"><div class="big">Nice work!</div><p style="margin:0;max-width:40ch">You reviewed '+ui.reviewed+' card'+(ui.reviewed===1?'':'s')+'. '+m+' of '+ui.deck.length+' in this deck are mastered.</p><div class="btns" style="justify-content:center"><button type="button" class="btn pri" data-act="restart">Study again</button><a class="btn" href="#/vocab/mastery">See mastery</a></div></div>';
  }

}

  if(ctx.sec==='casing'&&ctx.sub==='case'){
    var c=caseOf(ctx.arg);
    if(c&&ui.cid!==ctx.arg){ui.cid=ctx.arg;ui.stage=0;ui.hint=false;ui.sample=false;ui.run=false;ui.t=c.mins*60;ui.fb=''}
    every(1000,function(){if(ui.run&&ui.t>0){ui.t--;var e=$('#caseTimer');if(e)e.textContent=mmss(ui.t);if(ui.t===0){ui.run=false;toast('Time is up. Wrap up your recommendation.');var b=$('#timerBtn');if(b)b.textContent='Start'}}});
  }
  if(ctx.sec==='interview'&&ctx.sub==='practice'){every(1000,function(){if(ui.irun){ui.isec++;var e=$('#iTimer');if(e)e.textContent=mmss(ui.isec)}})}
  if(ctx.sec==='vocab'&&ctx.sub==='cards'&&!ui.deck)buildDeck();
  document.title=(n.label==='Dashboard'?'BRidge':n.label+' | BRidge');
  renderSide();renderTabbar();build();afterBuild();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- actions ---------- */
function stageStore(){var c=ctx.arg;S.caseWork[c]=S.caseWork[c]||{};return S.caseWork[c]}
function rateCard(kind){
  if(ui.busy||!ui.flipped)return;ui.busy=true;
  var id=ui.deck[ui.vi],l=lvl(id);
  S.levels[id]=kind==='again'?1:kind==='good'?(l<2?2:3):3;save();
  var cw=$('#cw');if(cw)cw.classList.add(kind==='again'?'out-left':'out-right');
  setTimeout(function(){
    ui.vi++;ui.reviewed++;ui.flipped=false;ui.busy=false;
    if(ui.vi>=ui.deck.length){ui.vdone=true;bump('Deck complete.')}
    var st=$('#vstage'),pg=$('#vprog');if(st)st.innerHTML=cardHTML();if(pg)pg.innerHTML=progHTML();
    var f=$('#flipBtn');if(f)f.focus({preventScroll:true});
  },270);
}
function flipCard(){
  var f=$('#flipper');if(!f||ui.busy)return;ui.flipped=!ui.flipped;f.classList.toggle('is-flipped',ui.flipped);
  var b=$('#flipBtn');if(b)b.setAttribute('aria-label','Flip card. Showing the '+(ui.flipped?'definition':'term')+'.');
  $$('[data-act="rate"]').forEach(function(x){x.disabled=!ui.flipped});
}
function exportCSV(){
  var cols=['title','skill','p','a','r','s','evidence','next','date','status','rehearsals'];
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  var csv=['Title','Competency','Problem','Action','Result','So what','Evidence','Next improvement','Next practice date','Status','Rehearsals'].map(q).join(',')+'\n'+S.stories.map(function(s){return cols.map(function(c){return q(s[c])}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bridge-pars-stories.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Exported your stories as a CSV file.');
}
var ACT={
 more:function(){$('#sheet').hidden=false},
 chart:function(b){ui.chart=b.dataset.v;$('#chartCard').innerHTML=chartCard()},
 diff:function(b){ui.diff=b.dataset.v;paint()},
 stage:function(b){ui.stage=+b.dataset.v;ui.hint=false;ui.sample=false;ui.fb='';paint()},
 next:function(){ui.stage++;ui.hint=false;ui.sample=false;ui.fb='';paint();window.scrollTo(0,0)},
 prev:function(){ui.stage--;ui.hint=false;ui.sample=false;ui.fb='';paint();window.scrollTo(0,0)},
 hint:function(){ui.hint=!ui.hint;paint()},
 sample:function(){ui.sample=!ui.sample;paint()},
 checknum:function(){
   var c=caseOf(ctx.arg),st=c.stages[ui.stage],v=parseFloat($('#num').value);
   if(isNaN(v)){ui.fb='Enter a number first.';ui.fbc='warn'}
   else if(Math.abs(v-st.answer)<=Math.abs(st.answer)*(st.tolerance||0.01)){ui.fb='Correct. That matches the expected answer of '+st.answer.toLocaleString()+'.';ui.fbc='good'}
   else{ui.fb='Not quite. Re-check your math. Try the hint, then run the numbers again.';ui.fbc='warn'}
   paint();
 },
 checkans:function(){
   var c=caseOf(ctx.arg),st=c.stages[ui.stage],t=($('#note').value||'').toLowerCase();
   if(words(t)<8){ui.fb='Write a few more sentences first, then check.';ui.fbc='warn';paint();return}
   var terms=st.terms||[],hit=terms.filter(function(x){return t.indexOf(x.toLowerCase())>-1}),miss=terms.filter(function(x){return hit.indexOf(x)<0});
   if(!terms.length){ui.fb='Saved. Compare your answer with the sample approach.';ui.fbc='good'}
   else if(!miss.length){ui.fb='Strong. You covered all '+terms.length+' key ideas: '+hit.join(', ')+'.';ui.fbc='good'}
   else{ui.fb='You covered '+hit.length+' of '+terms.length+' key ideas'+(hit.length?' ('+hit.join(', ')+')':'')+'. Consider adding: '+miss.join(', ')+'.';ui.fbc='warn'}
   paint();
 },
 finish:function(){
   if(S.caseDone[ctx.arg]){toast('You already finished this case.');return}
   S.caseDone[ctx.arg]=today();ui.run=false;save();bump('Case complete.');paint();
 },
 timer:function(){ui.run=!ui.run;var b=$('#timerBtn');if(b)b.textContent=ui.run?'Pause':'Start'},
 timerreset:function(){var c=caseOf(ctx.arg);ui.t=c.mins*60;ui.run=false;var e=$('#caseTimer');if(e)e.textContent=mmss(ui.t);var b=$('#timerBtn');if(b)b.textContent='Start'},
 sf:function(b){ui.sf=b.dataset.v;paint()},
 story:function(b){ui.sid=b.dataset.id;paint()},
 newstory:function(){var id='s'+Date.now();S.stories.unshift({id:id,title:'Untitled story',skill:'Leadership',p:'',a:'',r:'',s:'',evidence:'',next:'',date:'',status:'Drafting',rehearsals:0});ui.sid=id;ui.sf='All';save();paint();var t=$('#f_title');if(t){t.focus();t.select()}},
 delstory:function(b){
   if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Click again to delete';setTimeout(function(){if(b.isConnected){b.dataset.armed='';b.textContent='Delete story'}},3000);return}
   S.stories=S.stories.filter(function(s){return s.id!==ui.sid});ui.sid='';save();paint();toast('Story deleted.');
 },
 rehearse:function(){var s=S.stories.filter(function(x){return x.id===ui.sid})[0];if(!s)return;s.rehearsals++;if(s.status==='Drafting'&&filled(s)===4)s.status='Needs practice';if(s.status==='Needs practice'&&s.rehearsals>=2&&filled(s)===4)s.status='Ready';save();bump('Rehearsal logged.');paint()},
 export:exportCSV,
 ipick:function(b){ui.qid=b.dataset.id;ui.icat='All';ui.isec=0;ui.irun=false;location.hash='#/interview/practice'},
 itimer:function(){ui.irun=!ui.irun;var b=$('#iBtn');if(b)b.textContent=ui.irun?'Pause timer':'Start timer'},
 inext:function(){var l=iqList(),i=l.map(function(q){return q.id}).indexOf(ui.qid);ui.qid=l[(i+1)%l.length].id;ui.isec=0;ui.irun=false;paint()},
 isave:function(){
   var t=S.drafts[ui.qid]||'';if(words(t)<20){toast('Write a little more first. Aim for about 120 words.');return}
   var first=!S.saved[ui.qid];S.saved[ui.qid]=true;save();ui.irun=false;if(first)bump('Answer saved.');else toast('Answer updated.');paint();
 },
 flip:flipCard,
 rate:function(b){rateCard(b.dataset.v)},
 vtopic:function(b){ui.vtopic=b.dataset.v;buildDeck();paint()},
 restart:function(){buildDeck();var st=$('#vstage'),pg=$('#vprog');st.innerHTML=cardHTML();pg.innerHTML=progHTML()},
 resetvocab:function(){S.levels={};save();ui.deck=null;paint();toast('Vocab progress reset.')},
 rsave:function(b){var id=b.dataset.id;S.res[id]=!S.res[id];save();paint()},
 ropen:function(b){var r=RES.filter(function(x){return x.id===b.dataset.id})[0];if(r.url){window.open(r.url,'_blank','noopener')}else toast('Sample resource. Add its link in index.html to open it.')},
 req:function(b){var id=b.dataset.id;S.req[id]=!S.req[id];save();toast(S.req[id]?'Intro requested.':'Request cancelled.');paint()},
 join:function(b){var id=b.dataset.id;S.join[id]=!S.join[id];save();toast(S.join[id]?'You joined the group.':'You left the group.');paint()},
 rsvp:function(b){var id=b.dataset.id;S.rsvp[id]=!S.rsvp[id];save();toast(S.rsvp[id]?'You are on the list.':'RSVP removed.');paint()}
};
document.addEventListener('click',function(e){
  var sh=$('#sheet');
  if(!sh.hidden&&(e.target===sh||e.target.closest('#sheetbox a'))){sh.hidden=true}
  var b=e.target.closest('[data-act]');if(!b)return;
  if(ACT[b.dataset.act])ACT[b.dataset.act](b,e);
});
function onInput(e){
  var el=e.target,k=el.dataset&&el.dataset.in;
  if(el.id==='nameInput'){S.name=el.value;save();$$('.js-name').forEach(function(x){x.textContent=S.name||'there'});$$('.js-av').forEach(function(x){x.textContent=(S.name||'U').charAt(0).toUpperCase()});return}
  if(!k)return;
  if(k==='q'){ui.q=el.value;paint('qCase')}
  else if(k==='type'){ui.type=el.value;paint()}
  else if(k==='iq'){ui.iq=el.value;paint('iqs')}
  else if(k==='icat'){ui.icat=el.value;ui.qid='';ui.isec=0;paint()}
  else if(k==='gq'){ui.gq=el.value;paint('gq')}
  else if(k==='note'){var w=stageStore();w['n'+ui.stage]=el.value;if(el.value.trim()||Object.keys(w).length)save()}
  else if(k==='num'){var w2=stageStore();w2['v'+ui.stage]=el.value;save()}
  else if(k==='ans'){S.drafts[ui.qid]=el.value;save();var wc=$('#wc');if(wc)wc.textContent=words(el.value)+' words · aim for 120 to 200'}
  else if(k==='sf'){
    var s=S.stories.filter(function(x){return x.id===ui.sid})[0];if(!s)return;var f=el.dataset.f;
    if(f==='status'&&el.value==='Ready'&&filled(s)<4){el.value=s.status;toast('Complete all four PARS sections before marking a story Ready.');return}
    s[f]=el.value;save();updateStoryUI(s);
    if(f==='title'){var lb=$('.listbtn.on b');if(lb)lb.textContent=el.value||'Untitled story'}
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',function(e){if(e.target.tagName==='SELECT')onInput(e)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')$('#sheet').hidden=true;
  if(ctx.sec==='vocab'&&ctx.sub==='cards'&&/^[123]$/.test(e.key)&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){
    rateCard(['again','good','easy'][+e.key-1]);
  }
});

route();
})();
</script>
